name: CI

# The proof is in CI: a green check means the privacy guarantee is real, not claimed.
# Steps are guarded by file existence so this runs cleanly now (planning phase)
# and becomes the real demo as the code in PLAN.md lands.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Model + training tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + test
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            [ -f requirements.txt ] && pip install -r requirements.txt
            [ -f pyproject.toml ] && pip install -e . || true
            pytest -q
          else
            echo "::notice::No Python project yet (PLAN.md). CI will run pytest — local training loop, FedAvg aggregation, and the non-IID data split — once code lands."
          fi

  attack-demo:
    name: Headline demo — attack fails once DP is on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the compose stack
        run: docker compose config -q && echo "docker-compose.yml is valid"
      - name: Run the membership-inference attack/defense demo
        run: |
          pip install -r requirements.txt
          python -m demo
